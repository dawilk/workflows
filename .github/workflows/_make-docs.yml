name: Make Docs

on:
  push:
    paths:
      - "script/make-docs/*"
      - ".github/workflows/*"
  # TODO: consider removing wait for Release job, or run Release dry_run on PRs
  # pull_request:
  #   paths:
  #     - "script/make-docs/*"
  #     - ".github/workflows/*"

jobs:
  make-docs:
    name: Make Docs
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6

      - name: Make Docs
        run: |
          npm ci
          npx ts-node-script ./index.ts
        working-directory: ./script/make-docs

      - name: Wait for Release job
        uses: lewagon/wait-on-check-action@9312864dfbc9fd208e9c0417843430751c042800 # v1
        with:
          ref: ${{ github.ref }}
          check-name: 'Release / Semantic Release'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10

      - name: Push changes
        run: |
          git add docs/*
          DOC_CHANGES=$(git diff --name-only --cached)
          if test "$DOC_CHANGES"; then
            git config user.name github-actions
            git config user.email github-actions@github.com
            git commit -m 'docs: update docs'
            git push
          else
            echo "No doc changes made."
          fi
